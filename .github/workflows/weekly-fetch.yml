name: Weekly source archive

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: weekly-source-archive
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch upstream snapshots
        env:
          EUDA_COOKIE: ${{ secrets.EUDA_COOKIE }}
        run: python scripts/fetch_sources.py
      - name: Commit snapshots
        id: archive_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: archive weekly source snapshots"
          file_pattern: "archive/**"
      - name: Notify upstream repository
        if: steps.archive_commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        env:
          ARCHIVE_COMMIT: ${{ steps.archive_commit.outputs.commit_hash }}
        with:
          github-token: ${{ secrets.UPSTREAM_ISSUE_TOKEN }}
          script: |
            const owner = "LoliLin";
            const repo = "journal-android-multilingual";
            const title = "[SubstancesArchive] 上游数据快照已更新";
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find(
              issue => !issue.pull_request && issue.title === title
            );
            if (existing) {
              core.info(`已有未关闭的更新 issue：#${existing.number}，不重复创建。`);
              return;
            }

            const archiveRepo = `${context.repo.owner}/${context.repo.repo}`;
            const commit = process.env.ARCHIVE_COMMIT;
            const body = [
              "SubstancesArchive 本次自动抓取检测到归档变更。",
              "",
              `- 归档仓库提交：[${commit.slice(0, 7)}](https://github.com/${archiveRepo}/commit/${commit})`,
              `- 工作流运行：[查看本次抓取日志](${context.serverUrl}/${archiveRepo}/actions/runs/${context.runId})`,
              "",
              "各来源保持独立原样归档；请查看提交 diff。",
            ].join("\n");
            const issue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });
            core.info(`已创建更新 issue：#${issue.data.number}`);
